name: Build TrollStore IPA (iOS 15)

on:
  workflow_dispatch:
    inputs:
      rebuild_native:
        description: Ignore the cached native libraries
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.sha }}

env:
  MADEIRA_IOS_MIN: '15.0'

permissions:
  contents: write

jobs:
  native:
    name: Native libraries (Wine, FEX, FFmpeg, GnuTLS)
    runs-on: macos-26
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Cache key
        id: key
        run: |
          subs=$(git submodule status --recursive | awk '{print $1 $2}' | shasum -a 256 | cut -c1-16)
          echo "key=native-v2-${MADEIRA_IOS_MIN}-${subs}-${{ hashFiles('build/**', 'ci/build-native.sh', 'ci/patches/**') }}" >> "$GITHUB_OUTPUT"

      - name: Restore native libraries
        id: cache
        if: ${{ !inputs.rebuild_native }}
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.key.outputs.key }}
          path: native-libs.tar.zst

      - name: Select Xcode
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Host tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install bison flex ninja meson ccache zstd coreutils llvm || true

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ci/build-native.sh freetype gnutls ffmpeg wine pe64 dxmt_pe wow64fex dock ntdll wineserver win32u fex rppairing verify

      - name: Pack
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          files=(app/Madeira/lib*.a app/Madeira/legal/LICENSES-rppairing-crates.txt FEX/build-ios app/Madeira/arm64ec-windows/comctl32_v6.dll app/Madeira/arm64ec-windows/ntdll.dll app/Madeira/aarch64-windows/xtajit.dll app/Madeira/arm64ec-windows/dockhost.exe app/Madeira/arm64ec-windows/dock-notices.txt app/Madeira/arm64ec-windows/d3d11.dll app/Madeira/arm64ec-windows/dxgi.dll app/Madeira/arm64ec-windows/d3d10core.dll app/Madeira/arm64ec-windows/winemetal.dll)
          tar --exclude='*.o' --exclude='CMakeFiles' -cf - "${files[@]}" | zstd -T0 -19 -o native-libs.tar.zst
          ls -lh native-libs.tar.zst

      - name: Save native libraries
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.key.outputs.key }}
          path: native-libs.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: native-libs
          path: native-libs.tar.zst
          retention-days: 7

  dxmt:
    name: DXMT + LLVM for iOS
    runs-on: macos-26
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Cache key
        id: key
        run: |
          subs=$(git submodule status dxmt | awk '{print $1}')
          echo "key=dxmt-v2-${MADEIRA_IOS_MIN}-${subs}-${{ hashFiles('build/dxmt-ios/**', 'build/madeira-d3d12/**', 'madeira-d3d12/**', 'ci/build-native.sh', 'ci/patches/dxmt/**') }}" >> "$GITHUB_OUTPUT"

      - name: Restore DXMT
        id: cache
        if: ${{ !inputs.rebuild_native }}
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.key.outputs.key }}
          path: app/Madeira/libdxmt_combined.a

      - name: Select Xcode
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version
          xcodebuild -downloadComponent MetalToolchain || true

      - name: Host tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install ninja || true

      - name: LLVM for iOS (restore)
        if: steps.cache.outputs.cache-hit != 'true'
        id: llvm-cache
        uses: actions/cache/restore@v4
        with:
          key: llvm-ios-8dfdcc7b7-${{ env.MADEIRA_IOS_MIN }}-v1
          path: |
            toolchains/llvm-ios-build
            toolchains/llvm-project/llvm/include

      - name: LLVM for iOS (build)
        if: steps.cache.outputs.cache-hit != 'true' && steps.llvm-cache.outputs.cache-hit != 'true'
        run: ci/build-native.sh llvm

      - name: LLVM for iOS (save)
        if: steps.cache.outputs.cache-hit != 'true' && steps.llvm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: llvm-ios-8dfdcc7b7-${{ env.MADEIRA_IOS_MIN }}-v1
          path: |
            toolchains/llvm-ios-build
            toolchains/llvm-project/llvm/include

      - name: DXMT
        if: steps.cache.outputs.cache-hit != 'true'
        run: ci/build-native.sh dxmt

      - name: Save DXMT
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.key.outputs.key }}
          path: app/Madeira/libdxmt_combined.a

      - uses: actions/upload-artifact@v4
        with:
          name: dxmt-lib
          path: app/Madeira/libdxmt_combined.a
          retention-days: 7

  wine-i386:
    name: i386 Windows farm (WoW64)
    runs-on: macos-26
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Cache key
        id: key
        run: |
          subs=$(git submodule status wine dxmt | awk '{print $1}' | tr '\n' '-')
          echo "key=i386-v1-${subs}-${{ hashFiles('build/wine-i386/**', 'ci/build-native.sh', 'ci/patches/wine/**', 'ci/patches/dxmt/**') }}" >> "$GITHUB_OUTPUT"

      - name: Restore i386 farm
        id: cache
        if: ${{ !inputs.rebuild_native }}
        uses: actions/cache/restore@v4
        with:
          key: ${{ steps.key.outputs.key }}
          path: i386-windows.tar.zst

      - name: Select Xcode
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Host tools
        if: steps.cache.outputs.cache-hit != 'true'
        run: brew install bison flex ninja meson zstd || true

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        run: ci/build-native.sh i386

      - name: Pack
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          tar -cf - app/Madeira/i386-windows | zstd -T0 -19 -o i386-windows.tar.zst
          ls -lh i386-windows.tar.zst

      - name: Save i386 farm
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          key: ${{ steps.key.outputs.key }}
          path: i386-windows.tar.zst

      - uses: actions/upload-artifact@v4
        with:
          name: i386-windows
          path: i386-windows.tar.zst
          retention-days: 7

  app:
    name: Madeira.app → .tipa (iOS 15)
    needs: [native, dxmt, wine-i386]
    runs-on: macos-26
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - uses: actions/download-artifact@v4
        with:
          name: native-libs

      - uses: actions/download-artifact@v4
        with:
          name: dxmt-lib
          path: app/Madeira

      - uses: actions/download-artifact@v4
        with:
          name: i386-windows

      - name: Unpack the i386 farm (32-bit programs)
        run: |
          command -v zstd >/dev/null || brew install zstd
          zstd -d -c i386-windows.tar.zst | tar -xf -
          ls app/Madeira/i386-windows | wc -l
          test -f app/Madeira/i386-windows/ntdll.dll

      - name: Unpack native libraries
        run: |
          brew install zstd ldid || true
          zstd -d -c native-libs.tar.zst | tar -xf -
          ls -l app/Madeira/*.a

      - name: Prepare x86_64-vcruntime
        run: mkdir -p app/Madeira/x86_64-vcruntime

      - name: Select Xcode
        run: |
          sudo xcode-select -s "$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)"
          xcodebuild -version

      - name: Patch iOS 15 compatibility
        run: |
          find app -name "*.swift" -exec sed -i '' 's/Task\.sleep(for: \.seconds(\([^)]*\)))/Task.sleep(nanoseconds: UInt64(\1 * 1_000_000_000))/g' {} +
          find app -name "project.pbxproj" -exec sed -i '' 's/IPHONEOS_DEPLOYMENT_TARGET = [0-9.]*;/IPHONEOS_DEPLOYMENT_TARGET = 15.0;/g' {} +

      - name: Build Madeira.app
        run: |
          PROJ=$(find app -maxdepth 2 -name "*.xcodeproj" | head -n 1)
          echo "Building project: $PROJ"
          xcodebuild -project "$PROJ" \
            -scheme Madeira \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build/DerivedData \
            IPHONEOS_DEPLOYMENT_TARGET=15.0 \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

      - name: Sign for TrollStore and pack .tipa
        run: |
          APP_PATH=$(find build/DerivedData -name "Madeira.app" | head -n 1)
          echo "Found app: $APP_PATH"
          cat << 'EOF' > entitlements.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://apple.com">
          <plist version="1.0">
          <dict>
            <key>platform-application</key>
            <true/>
            <key>com.apple.private.security.no-container</key>
            <false/>
            <key>get-task-allow</key>
            <true/>
            <key>dynamic-codesigning</key>
            <true/>
            <key>com.apple.private.skip-library-validation</key>
            <true/>
          </dict>
          </plist>

          EOF
          find "$APP_PATH" \( -name "*.dylib" -o -name "*.framework" \) -exec ldid -S {} + || true
          for ext in "$APP_PATH/PlugIns/"*.appex; do
            [ -e "$ext" ] && ldid -Sentitlements.plist "$ext" || true
          done
          ldid -Sentitlements.plist "$APP_PATH"
          mkdir -p Payload
          cp -R "$APP_PATH" Payload/
          zip -r -9 Madeira-iOS15.tipa Payload
          ls -lh Madeira-iOS15.tipa

      - name: Upload TrollStore .tipa
        uses: actions/upload-artifact@v4
        with:
          name: Madeira-iOS15-tipa
          path: Madeira-iOS15.tipa
          retention-days: 14
